services:
  postgres:
    image: postgres:16.8-alpine
    container_name: nutriai-postgres
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nutriai}
      POSTGRES_USER: ${DATABASE_USERNAME:-nutri_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_this_in_local_env}
    volumes:
      - nutriai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nutriai_pgdata:
    name: nutriai_pgdata

