# ==============================================================================
# Nutri AI — Test Configuration (backend/src/test/resources/application.yml)
#
# Dedicated test-only configuration used during Maven Surefire test execution.
# This file exists strictly under src/test/resources and is NEVER packaged
# into the production JAR or production runtime classpath.
# ==============================================================================

spring:
  application:
    name: nutri-ai-backend
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:nutriai}
    username: ${DATABASE_USERNAME:nutri_user}
    password: ${DATABASE_PASSWORD:change_this_in_local_env}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: always

app:
  security:
    jwt:
      secret: "test_jwt_secret_key_used_only_in_surefire_tests_minimum_32_bytes!"
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    cors:
      allowed-origins: http://localhost:5173
    cookie:
      secure: false
